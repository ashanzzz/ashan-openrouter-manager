services:
  openrouter-manager:
    build: .
    image: ashan/openrouter-manager:3.0.0
    container_name: ashan-openrouter-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      RUST_LOG: ${RUST_LOG:-info}
      PORT: 8080
      DATA_DIR: /data
      WEB_DIR: /app/web
    volumes:
      - ./data:/data
