services:
  openrouter-manager:
    build: .
    image: ghcr.io/ashanzzz/ashan-openrouter-manager:latest
    container_name: ashan-openrouter-manager
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    environment:
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      RUST_LOG: ${RUST_LOG:-info}
      DATA_DIR: /data
      WEB_DIR: /app/web
    volumes:
      - ./data:/data
